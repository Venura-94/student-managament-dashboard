{% extends 'Home/base.html' %}
{% block title %}Add Expenses{% endblock %}

{% block content %}
{% include 'partials/page_header.html' with page_title="Add Expenses" %}

<div class="panel">
  <form method="post">
    {% csrf_token %}
    <div class="form-section-title">Expense Details</div>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Item Name</label>
        <input type="text" class="form-control" name="item_name" placeholder="Enter item name">
      </div>
      <div class="col-md-4">
        <label class="form-label">Item Quantity</label>
        <input type="number" class="form-control" name="item_quantity" placeholder="Enter quantity">
      </div>
      <div class="col-md-4">
        <label class="form-label">Amount</label>
        <input type="number" class="form-control" name="amount" placeholder="Enter amount">
      </div>
      <div class="col-md-6">
        <label class="form-label">Purchase Source</label>
        <input type="text" class="form-control" name="purchase_source" placeholder="Enter purchase source">
      </div>
      <div class="col-md-6">
        <label class="form-label">Purchase Date</label>
        <input type="date" class="form-control" name="purchase_date">
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows="3" placeholder="Enter description"></textarea>
      </div>
    </div>

    <div class="d-flex gap-3 mt-4">
      <button type="submit" class="btn-primary-custom">Save</button>
      <a href="{% url 'expenses' %}" class="btn-outline-custom">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
