{% extends 'Home/base.html' %}
{% block title %}Add Fees{% endblock %}

{% block content %}
{% include 'partials/page_header.html' with page_title="Add Fees" %}

<div class="panel">
  <form method="post">
    {% csrf_token %}
    <div class="form-section-title">Fees Details</div>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Student Name</label>
        <input type="text" class="form-control" name="student_name" placeholder="Enter student name">
      </div>
      <div class="col-md-4">
        <label class="form-label">Class</label>
        <input type="text" class="form-control" name="class_name" placeholder="Enter class">
      </div>
      <div class="col-md-4">
        <label class="form-label">Fees Type</label>
        <select class="form-select" name="fees_type">
          <option>Tuition Fees</option>
          <option>Transport Fees</option>
          <option>Library Fees</option>
          <option>Exam Fees</option>
          <option>Hostel Fees</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Amount</label>
        <input type="number" class="form-control" name="amount" placeholder="Enter amount">
      </div>
      <div class="col-md-4">
        <label class="form-label">Due Date</label>
        <input type="date" class="form-control" name="due_date">
      </div>
      <div class="col-md-4">
        <label class="form-label">Payment Date</label>
        <input type="date" class="form-control" name="payment_date">
      </div>
      <div class="col-md-4">
        <label class="form-label">Payment Method</label>
        <select class="form-select" name="payment_method">
          <option>Cash</option>
          <option>Card</option>
          <option>Bank Transfer</option>
          <option>Online</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Status</label>
        <select class="form-select" name="status">
          <option>Paid</option>
          <option>Unpaid</option>
          <option>Pending</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows="3" placeholder="Enter description"></textarea>
      </div>
    </div>

    <div class="d-flex gap-3 mt-4">
      <button type="submit" class="btn-primary-custom">Save</button>
      <a href="{% url 'fees_collection' %}" class="btn-outline-custom">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
