{% extends 'Home/base.html' %}
{% block title %}Add Salary{% endblock %}

{% block content %}
{% include 'partials/page_header.html' with page_title="Add Salary" %}

<div class="panel">
  <form method="post">
    {% csrf_token %}
    <div class="form-section-title">Salary Details</div>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Staff Name</label>
        <input type="text" class="form-control" name="staff_name" placeholder="Enter staff name">
      </div>
      <div class="col-md-4">
        <label class="form-label">Designation</label>
        <input type="text" class="form-control" name="designation" placeholder="Enter designation">
      </div>
      <div class="col-md-4">
        <label class="form-label">Salary Month</label>
        <input type="month" class="form-control" name="salary_month">
      </div>
      <div class="col-md-4">
        <label class="form-label">Basic Salary</label>
        <input type="number" class="form-control" name="basic_salary" placeholder="Enter basic salary">
      </div>
      <div class="col-md-4">
        <label class="form-label">Allowances</label>
        <input type="number" class="form-control" name="allowances" placeholder="Enter allowances">
      </div>
      <div class="col-md-4">
        <label class="form-label">Deductions</label>
        <input type="number" class="form-control" name="deductions" placeholder="Enter deductions">
      </div>
      <div class="col-md-4">
        <label class="form-label">Payment Date</label>
        <input type="date" class="form-control" name="payment_date">
      </div>
      <div class="col-md-4">
        <label class="form-label">Payment Method</label>
        <select class="form-select" name="payment_method">
          <option>Bank Transfer</option>
          <option>Cash</option>
          <option>Cheque</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Status</label>
        <select class="form-select" name="status">
          <option>Paid</option>
          <option>Pending</option>
        </select>
      </div>
    </div>

    <div class="d-flex gap-3 mt-4">
      <button type="submit" class="btn-primary-custom">Save</button>
      <a href="{% url 'salary' %}" class="btn-outline-custom">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
