{% extends 'Home/base.html' %}
{% block title %}Add Subject{% endblock %}

{% block content %}
{% include 'partials/page_header.html' with page_title="Add Subject" %}

<div class="panel">
  <form method="post">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Subject Name</label>
        <input type="text" class="form-control" name="name" placeholder="Enter subject name">
      </div>
      <div class="col-md-6">
        <label class="form-label">Subject Code</label>
        <input type="text" class="form-control" name="code" placeholder="Enter subject code">
      </div>
      <div class="col-md-6">
        <label class="form-label">Type</label>
        <select class="form-select" name="type">
          <option>Theory</option>
          <option>Practical</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Department</label>
        <input type="text" class="form-control" name="department" placeholder="Enter department">
      </div>
    </div>

    <div class="d-flex gap-3 mt-4">
      <button type="submit" class="btn-primary-custom">Save</button>
      <a href="{% url 'subject_list' %}" class="btn-outline-custom">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
