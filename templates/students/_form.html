<form method="post" enctype="multipart/form-data">
  {% csrf_token %}

  <div class="form-section-title">Profile Photo</div>
  <div class="d-flex align-items-center gap-3 mb-2">
    <div class="upload-photo">
      <i class="bi bi-camera"></i>
      <input type="file" name="student_image" accept="image/png, image/jpeg" {% if not is_edit %}required{% endif %}>
    </div>
    <div class="text-muted small">Upload a profile photo (JPG or PNG, max 2MB)</div>
  </div>

  <div class="form-section-title">Student Information</div>
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">First Name</label>
      <input type="text" class="form-control" name="first_name" value="{{ student.first_name|default:'' }}" placeholder="Enter first name" pattern="[A-Za-z ]+" title="Letters only" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Last Name</label>
      <input type="text" class="form-control" name="last_name" value="{{ student.last_name|default:'' }}" placeholder="Enter last name" pattern="[A-Za-z ]+" title="Letters only" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Student ID</label>
      <input type="text" class="form-control" name="student_id" value="{{ student.student_id|default:'' }}" placeholder="Enter student ID" pattern="[A-Za-z0-9\-]+" title="Letters, numbers and hyphens only" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Admission Number</label>
      <input type="number" step="0.01" min="0" class="form-control" name="addmission_number" value="{{ student.addmission_number|default:'' }}" placeholder="Enter admission number" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Date of Birth</label>
      <input type="date" class="form-control" name="date_of_birth" value="{{ student.date_of_birth|date:'Y-m-d'|default:'' }}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Gender</label>
      <select class="form-select" name="gender" required>
        <option value="" {% if not student.gender %}selected{% endif %} disabled hidden>Select gender</option>
        <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
        <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Religion</label>
      <input type="text" class="form-control" name="religion" value="{{ student.religion|default:'' }}" placeholder="Enter religion" pattern="[A-Za-z ]+" title="Letters only" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Class</label>
      <select class="form-select" name="student_class" required>
        <option value="" {% if not student.student_class %}selected{% endif %} disabled hidden>Select class</option>
        <option {% if student.student_class == "I" %}selected{% endif %}>I</option>
        <option {% if student.student_class == "II" %}selected{% endif %}>II</option>
        <option {% if student.student_class == "III" %}selected{% endif %}>III</option>
        <option {% if student.student_class == "IV" %}selected{% endif %}>IV</option>
        <option {% if student.student_class == "V" %}selected{% endif %}>V</option>
        <option {% if student.student_class == "VI" %}selected{% endif %}>VI</option>
        <option {% if student.student_class == "VII" %}selected{% endif %}>VII</option>
        <option {% if student.student_class == "VIII" %}selected{% endif %}>VIII</option>
        <option {% if student.student_class == "IX" %}selected{% endif %}>IX</option>
        <option {% if student.student_class == "X" %}selected{% endif %}>X</option>
        <option {% if student.student_class == "XI" %}selected{% endif %}>XI</option>
        <option {% if student.student_class == "XII" %}selected{% endif %}>XII</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Section</label>
      <select class="form-select" name="section" required>
        <option value="" {% if not student.section %}selected{% endif %} disabled hidden>Select section</option>
        <option {% if student.section == "A" %}selected{% endif %}>A</option>
        <option {% if student.section == "B" %}selected{% endif %}>B</option>
        <option {% if student.section == "C" %}selected{% endif %}>C</option>
        <option {% if student.section == "D" %}selected{% endif %}>D</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Mobile Number</label>
      <input type="tel" class="form-control" name="mobile_number" value="{{ student.mobile_number|default:'' }}" placeholder="Enter mobile number" pattern="[0-9]{10,15}" title="10 to 15 digits" maxlength="15" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Joining Date</label>
      <input type="date" class="form-control" name="joining_date" value="{{ student.joining_date|date:'Y-m-d'|default:'' }}" required>
    </div>
  </div>

  <div class="form-section-title">Address Information</div>
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Present Address</label>
      <textarea class="form-control" name="present_address" rows="2" placeholder="Enter present address" required>{{ student.parent.present_address|default:'' }}</textarea>
    </div>
    <div class="col-md-6">
      <label class="form-label">Permanent Address</label>
      <textarea class="form-control" name="permanent_address" rows="2" placeholder="Enter permanent address" required>{{ student.parent.permanent_address|default:'' }}</textarea>
    </div>
  </div>

  <div class="form-section-title">Father Details</div>
  <div class="row g-3">
    <div class="col-md-3">
      <label class="form-label">Father Name</label>
      <input type="text" class="form-control" name="father_name" value="{{ student.parent.father_name|default:'' }}" placeholder="Enter father name" pattern="[A-Za-z ]+" title="Letters only" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Father Occupation</label>
      <input type="text" class="form-control" name="father_occupation" value="{{ student.parent.father_occupation|default:'' }}" placeholder="Enter father occupation" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Father Mobile</label>
      <input type="tel" class="form-control" name="father_mobile" value="{{ student.parent.father_mobile|default:'' }}" placeholder="Enter father mobile" pattern="[0-9]{10,15}" title="10 to 15 digits" maxlength="15" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Father Email</label>
      <input type="email" class="form-control" name="father_email" value="{{ student.parent.father_email|default:'' }}" placeholder="Enter father email" required>
    </div>
  </div>

  <div class="form-section-title">Mother Details</div>
  <div class="row g-3">
    <div class="col-md-3">
      <label class="form-label">Mother Name</label>
      <input type="text" class="form-control" name="mother_name" value="{{ student.parent.mother_name|default:'' }}" placeholder="Enter mother name" pattern="[A-Za-z ]+" title="Letters only" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Mother Occupation</label>
      <input type="text" class="form-control" name="mother_occupation" value="{{ student.parent.mother_occupation|default:'' }}" placeholder="Enter mother occupation" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Mother Mobile</label>
      <input type="tel" class="form-control" name="mother_mobile" value="{{ student.parent.mother_mobile|default:'' }}" placeholder="Enter mother mobile" pattern="[0-9]{10,15}" title="10 to 15 digits" maxlength="15" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Mother Email</label>
      <input type="email" class="form-control" name="mother_email" value="{{ student.parent.mother_email|default:'' }}" placeholder="Enter mother email" required>
    </div>
  </div>

  <div class="d-flex gap-3 mt-4">
    <button type="submit" class="btn-primary-custom">{{ submit_label|default:"Save" }}</button>
    <a href="{% url 'student_list' %}" class="btn-outline-custom">Cancel</a>
  </div>
</form>
