{% extends 'Home/base.html' %}
{% block title %}Sports{% endblock %}

{% block content %}
{% include 'partials/page_header.html' with page_title="Sports" %}

<div class="row g-4">
  {% for sp in sports %}
  <div class="col-xl-3 col-md-6">
    <div class="panel h-100 text-center">
      <div class="icon-circle {{ sp.bg_class }} mx-auto mb-3" style="width:64px;height:64px;border-radius:50%;">
        <i class="bi {{ sp.icon }}" style="font-size:28px;"></i>
      </div>
      <h3 class="panel-title">{{ sp.name }}</h3>
      <p class="text-muted small mb-2">Coach: {{ sp.coach }}</p>
      <p class="text-muted small mb-0">{{ sp.members }} Members</p>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
