{% extends 'auth/auth_base.html' %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<h3>Forgot Password?</h3>
<p class="sub-text">Enter your email and we'll send you a link to reset your password.</p>

<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Email Address</label>
    <input type="email" class="form-control" name="email" placeholder="Enter your email">
  </div>
  <button type="submit" class="btn-primary-custom w-100">Send Reset Link</button>
</form>

<p class="text-center mt-4 mb-0 small">
  Remember your password? <a href="{% url 'login' %}" class="fw-semibold">Back to Sign In</a>
</p>
{% endblock %}
