{% extends 'auth/auth_base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<h3>Create Account</h3>
<p class="sub-text">Sign up to get started with PreSkool.</p>

<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Full Name</label>
    <input type="text" class="form-control" name="name" placeholder="Enter your full name">
  </div>
  <div class="mb-3">
    <label class="form-label">Email Address</label>
    <input type="email" class="form-control" name="email" placeholder="Enter your email">
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" name="password" placeholder="Create a password">
  </div>
  <div class="mb-3">
    <label class="form-label">Confirm Password</label>
    <input type="password" class="form-control" name="confirm_password" placeholder="Confirm your password">
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="terms">
    <label class="form-check-label small" for="terms">I agree to the Terms &amp; Privacy Policy</label>
  </div>
  <button type="submit" class="btn-primary-custom w-100">Create Account</button>
</form>

<p class="text-center mt-4 mb-0 small">
  Already have an account? <a href="{% url 'login' %}" class="fw-semibold">Sign In</a>
</p>
{% endblock %}
