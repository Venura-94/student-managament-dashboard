{% extends 'auth/auth_base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<h3>Welcome Back!</h3>
<p class="sub-text">Sign in to continue to your dashboard.</p>

<form method="post" action="{% url 'dashboard_admin' %}">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Email Address</label>
    <input type="email" class="form-control" name="email" placeholder="Enter your email">
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" name="password" placeholder="Enter your password">
  </div>
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="remember">
      <label class="form-check-label small" for="remember">Remember Me</label>
    </div>
    <a href="{% url 'forgot_password' %}" class="small">Forgot Password?</a>
  </div>
  <button type="submit" class="btn-primary-custom w-100">Sign In</button>
</form>

<p class="text-center mt-4 mb-0 small">
  Don't have an account? <a href="{% url 'register' %}" class="fw-semibold">Sign Up</a>
</p>
{% endblock %}
