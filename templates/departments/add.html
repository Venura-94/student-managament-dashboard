{% extends 'Home/base.html' %}
{% block title %}Add Department{% endblock %}

{% block content %}
{% include 'partials/page_header.html' with page_title="Add Department" %}

<div class="panel">
  <form method="post">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Department Name</label>
        <input type="text" class="form-control" name="name" placeholder="Enter department name">
      </div>
      <div class="col-md-6">
        <label class="form-label">Department Head</label>
        <input type="text" class="form-control" name="head" placeholder="Enter department head">
      </div>
      <div class="col-md-6">
        <label class="form-label">Total Staff</label>
        <input type="number" class="form-control" name="total_staff" placeholder="Enter total staff">
      </div>
      <div class="col-md-6">
        <label class="form-label">Status</label>
        <select class="form-select" name="status">
          <option>Active</option>
          <option>Inactive</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows="3" placeholder="Enter department description"></textarea>
      </div>
    </div>

    <div class="d-flex gap-3 mt-4">
      <button type="submit" class="btn-primary-custom">Save</button>
      <a href="{% url 'department_list' %}" class="btn-outline-custom">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
